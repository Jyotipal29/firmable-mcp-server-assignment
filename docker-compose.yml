services:
  postgres:
    image: postgres:16-alpine
    container_name: firmable-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: account_intelligence
    ports:
      - "5432:5432"
    volumes:
      - firmable-mcp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d account_intelligence"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  firmable-mcp-postgres-data:
